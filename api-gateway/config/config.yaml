app:
  port: 8080
  shutdown_timeout: 10s
  migration_dir: ./migrations
  log_level: debug
database_url: postgres
storage:
  endpoint: minio:9000
  access_key: minio
  secret_key: minio123
  use_ssl: false
  region: us-east-1
  audio_bucket: audio
  tab_bucket: tab
  expiration_time: 1h
kafka:
  brokers:
    - kafka:9092
  topics:
    audio_separation: audio.separation.start
    tab_generation: tab.generation.request
retry:
  backoff: exponential
  max_attempts: 3
  base: 100ms
  factor: 2
  max: 1s
  jitter: 0.1
